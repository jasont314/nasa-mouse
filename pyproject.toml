[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-mouse-spaceflight"
version = "1.0.0"
description = "Mouse spaceflight transcriptomics workflows for NASA OSDR"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Jason Trinh", email = "jasontrinh@berkeley.edu"},
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["nasa_mouse_*"]

version: 1
contract: lacan_modelddim_reference_v1

run:
  output_dir: outputs/generative_benchmark/runs/lacan_diffusion/archs4_liver_enriched_paper_native_seed1234
  seed: 1234
  source_root: assets/model_sources/rna-diffusion

data:
  archs4_h5: assets/archs4/mouse_gene_v2.5.h5
  cohort_metadata: outputs/generative_benchmark/data_audit/archs4/archs4_healthy_preferred_balanced.tsv.gz
  gene_lengths: data/reference/gencode_vM39_mouse_gene_lengths.tsv
  source_landmark_map: data/diffusion/l1000_human_to_mouse_ensembl.tsv
  human_landmarks: assets/model_sources/rna-diffusion/data/gtex_description.csv
  mouse_landmark_panel: data/diffusion/l974_mouse_paper_parity.tsv
  prepared_h5: outputs/generative_benchmark/data/lacan_diffusion/archs4_liver_enriched_paper_native_l974.h5
  profiles: 9998
  profiles_per_tissue:
    liver: 9466
    kidney: 532
  exclude_archs4_sample_indices: [930749, 930753]
  selection_seed: 42
  split_seed: 42
  split_strategy: series_holdout
  split_group_column: series_id
  split_fractions:
    train: 0.70
    validation: 0.15
    test: 0.15
  normalization: full_transcriptome_tpm_then_train_maxabs

model:
  hidden_dims: [8192, 8192]
  dropout: 0.1
  time_embedding_dim: 1
  tissue_embedding_dim: 2
  sinusoidal_time: false
  diffusion_timesteps: 1000
  beta_schedule: quad
  beta_start: 0.0001
  beta_end: 0.02
  ema_decay: 0.999

training:
  epochs: 15000
  batch_size: 2048
  optimizer: Adam
  learning_rate: 0.0004783833151836702
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  scheduler: OneCycle
  one_cycle_peak_step: 1000
  gradient_clipping: false
  weighted_sampling: false
  amp: true
  num_workers: 8
  checkpoint_every_epochs: 500
  log_every_epochs: 50

evaluation:
  trajectory_samples: 1024
  trajectory_batch_size: 256
  trajectory_timesteps: [1000, 200, 0]
  pca_background_samples: 5000
  quality_samples: 7000
  quality_batch_size: 1024
  metric_samples: 7000

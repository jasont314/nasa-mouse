version: 1

shared_profiles:
  shared_raw:
    input_units: raw_counts
    library_normalization: none
    transform: none
    scaler: none
  shared_log1p_counts:
    input_units: raw_counts
    library_normalization: none
    transform: log1p
    scaler: none
  shared_log1p_cpm:
    input_units: raw_counts
    library_normalization: cpm
    transform: log1p
    scaler: none
  shared_log1p_cpm_zscore:
    input_units: raw_counts
    library_normalization: cpm
    transform: log1p
    scaler: zscore
  shared_log2p1_cpm_zscore:
    input_units: raw_counts
    library_normalization: cpm
    transform: log2p1
    scaler: zscore
  shared_log1p_cpm_robust:
    input_units: raw_counts
    library_normalization: cpm
    transform: log1p
    scaler: robust
  shared_log1p_cpm_maxabs:
    input_units: raw_counts
    library_normalization: cpm
    transform: log1p
    scaler: maxabs
  shared_tpm_maxabs:
    input_units: raw_counts
    library_normalization: tpm
    transform: none
    scaler: maxabs
    requires: mouse gene lengths aligned to the selected Ensembl IDs
  wgan_nasa_cpm_zscore:
    input_units: raw_counts
    library_normalization: cpm
    transform: log1p
    scaler: zscore
    adaptation_note: NASA count-depth adaptation; this is not the paper-native RNASeqDB preprocessing contract.

paper_native_profiles:
  vinas_wgan_gp:
    input_units: raw_counts
    library_normalization: none
    transform: log1p
    scaler: zscore
    source_contract: The released script applies log1p directly to normalized RNASeqDB expression, then fits per-gene mean and standard deviation on training profiles.
  lacan_diffusion:
    input_units: raw_counts
    library_normalization: tpm
    transform: none
    scaler: maxabs
    requires: mouse gene lengths aligned to the selected Ensembl IDs
  genejepa:
    input_units: raw_counts
    library_normalization: none
    transform: log1p
    scaler: nonzero_global_zscore
    adaptation_note: Nonzero bulk expression values follow the paper's scalar global Z-score; absent genes remain absent tokens.

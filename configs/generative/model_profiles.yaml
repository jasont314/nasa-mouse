version: 1

profiles:
  vinas_wgan_gp:
    paper_native:
      noise_dim: 64
      hidden_dims: [256, 256]
      batch_size: 32
      critic_steps: 5
      gradient_penalty: 10.0
      optimizer: rmsprop
      learning_rate: 0.00005
      epochs: 2000
      reference_epochs: 2000
      finetune_epochs: 2000
      finetune_learning_rate: 0.00005
    practical_screen:
      noise_dim: 64
      hidden_dims: [256, 256]
      batch_size: 128
      critic_steps: 5
      gradient_penalty: 10.0
      optimizer: adam
      learning_rate: 0.0001
      epochs: 100
      reference_epochs: 100
      finetune_epochs: 50
      finetune_learning_rate: 0.00005

  lacan_diffusion:
    paper_native:
      batch_size: 512
      learning_rate: 0.0005
      finetune_learning_rate: 0.0001
      epochs: 100
      reference_epochs: 100
      finetune_epochs: 100
      hidden_dim: 512
      n_blocks: 2
      dropout: 0.1
      time_embedding_dim: 64
      categorical_embedding_dim: 8
      diffusion_timesteps: 1000
      sample_steps: 1000
      beta_schedule: quad
      beta_start: 0.0001
      beta_end: 0.02
      sampler: ddim
      eta: 0.0
      use_amp: true
      use_ema: true
      ema_decay: 0.999
      landmark_strategy: l1000
      n_landmarks: 978
      reconstruction_alpha: 1.0
      reconstruction_samples: 10000
    practical_screen:
      batch_size: 256
      learning_rate: 0.0005
      finetune_learning_rate: 0.0001
      epochs: 100
      reference_epochs: 100
      finetune_epochs: 50
      hidden_dim: 512
      n_blocks: 2
      dropout: 0.1
      time_embedding_dim: 64
      categorical_embedding_dim: 8
      diffusion_timesteps: 1000
      sample_steps: 50
      beta_schedule: quad
      beta_start: 0.0001
      beta_end: 0.02
      sampler: ddim
      eta: 0.0
      use_amp: true
      use_ema: true
      ema_decay: 0.999
      landmark_strategy: l1000_or_hvg
      n_landmarks: 512
      reconstruction_alpha: 1.0
      reconstruction_samples: 10000

  genejepa:

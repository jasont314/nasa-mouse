version: 1
contract: lacan_modelddim_factorized_adapter_v1

run:
  output_dir: outputs/generative/benchmark/runs/lacan_diffusion/osdr_factorized_study_lora256_replicated_validation_seed2020
  seed: 2020
  source_root: assets/model_sources/rna-diffusion

data:
  prepared_h5: outputs/generative/benchmark/data/lacan_diffusion/osdr_factorized_within_study_replicated_validation_l974.h5
  samples_tsv: outputs/generative/benchmark/data/lacan_diffusion/osdr_factorized_within_study_replicated_validation_l974.samples.tsv.gz
  pretrained_model: outputs/generative/benchmark/runs/lacan_diffusion/archs4_mouse_paper_parity_seed1234/model.pt

conditioning:
  study: true
  material_type: true

adapter:
  domain_lora_rank: 256
  domain_lora_alpha: 256.0

model:
  hidden_dims: [8192, 8192]
  dropout: 0.1
  time_embedding_dim: 1
  tissue_embedding_dim: 2
  sinusoidal_time: false
  diffusion_timesteps: 1000
  beta_schedule: quad
  beta_start: 0.0001
  beta_end: 0.02
  ema_decay: 0.999

training:
  batch_size: 256
  num_workers: 4
  amp: true
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  ema_decay: 0.999
  condition_dropout: 0.15
  log_every_steps: 500
  validate_every_steps: 2000
  checkpoint_every_steps: 2000
  stages:
    domain:
      steps: 16000
      learning_rate: 0.000075
      warmup_steps: 500
      sampling_strata: [tissue, accession]
    condition:
      steps: 6000
      learning_rate: 0.000075
      warmup_steps: 300
      sampling_strata: [tissue, accession, condition]

evaluation:
  split: validation
  metric_samples: 0
  train_metric_samples: 0
  batch_size: 128
  sampling_steps: 100
  validation_sampling_seed: 3020
  train_sampling_seed: 4020
  guidance_scales: [1.0]

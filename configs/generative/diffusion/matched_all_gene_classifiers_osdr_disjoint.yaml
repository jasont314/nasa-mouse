version: 1

run:
  output_dir: outputs/generative/benchmark/analyses/matched_all_gene_classifiers_osdr_disjoint_v1
  seed: 10400

sources:
  - scope: tissue
    workflow_config: configs/generative/diffusion/within_study_generated_feature_stability_osdr_disjoint.yaml
    analysis_dir: outputs/generative/benchmark/analyses/within_study_generated_feature_stability_osdr_disjoint_v1
  - scope: muscle_group
    workflow_config: configs/generative/diffusion/within_study_generated_feature_stability_muscle_groups_osdr_disjoint.yaml
    analysis_dir: outputs/generative/benchmark/analyses/within_study_generated_feature_stability_muscle_groups_osdr_disjoint_v1

annotations:
  bh_fdr_inventory: paper/synthetic_guided_spaceflight/source_data/table_s11_all_random_effects_bh_fdr_genes.tsv
  reactome_gmt: data/pathways/reactome_current_mouse_ensembl.gmt

analysis:
  regularization_c: [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1]
  synthetic_weight: 1.0
  permutation_repeats: 10
  minimum_permutation_roc_auc: 0.001
  minimum_positive_outer_fraction: 0.5
  top_genes_per_arm: 25

version: 1

phases:
  - name: phase_0_wgan_paper_native_archs4
    purpose: Establish the exact Viñas architecture/training contract on broad mouse tissues before tuning.
    axes:
      model: [vinas_wgan_gp]
      model_profile: [paper_native]
      task: [conditional_generation]
      preprocessing_profile: [model_native]
      feature_space: [hvg_2000]
      harmonization: [none]
      training_regime: [archs4_only]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [false]
      study_policy: [not_conditioned]
      seed: [2020]

  - name: phase_0_wgan_osdr_preprocessing_pair
    purpose: Compare strict released preprocessing with the declared CPM depth adaptation for pooled FLT/GC generation.
    axes:
      model: [vinas_wgan_gp]
      model_profile: [paper_native]
      task: [conditional_generation]
      preprocessing_profile: [model_native, wgan_nasa_cpm_zscore]
      feature_space: [hvg_2000]
      harmonization: [none]
      training_regime: [osdr_only]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [true]
      study_policy: [not_conditioned]
      seed: [2020]

  - name: phase_0_wgan_archs4_osdr_transfer_screen
    purpose: Test whether exact-architecture WGAN transfer improves the strongest direct OSDR preprocessing branch before spending the paper-native duration.
    axes:
      model: [vinas_wgan_gp]
      model_profile: [paper_architecture_screen]
      task: [conditional_generation]
      preprocessing_profile: [wgan_nasa_cpm_zscore]
      feature_space: [hvg_2000]
      harmonization: [none]
      training_regime: [archs4_pretrain_osdr_finetune]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [true]
      study_policy: [not_conditioned]
      seed: [2020]

  - name: phase_0_smoke
    purpose: Verify data flow, conditioning, inverse transforms, and finite generation.
    axes:
      model: [vinas_wgan_gp, lacan_diffusion]
      model_profile: [practical_screen]
      task: [conditional_generation]
      preprocessing_profile: [shared_log1p_cpm_zscore]
      feature_space: [hvg_2000]
      harmonization: [none]
      training_regime: [osdr_only]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [true]
      study_policy: [not_conditioned]
      seed: [2020]

  - name: phase_0_archs4_tissue_generation
    purpose: Register or reproduce the completed exact upstream ModelDDIM ARCHS4 tissue baseline.
    axes:
      model: [lacan_diffusion]
      model_profile: [paper_native]
      execution_backend: [nasa_mouse_diffusion.paper_parity]
      backend_config: [configs/generative/diffusion/archs4_mouse_paper_parity.yaml]
      task: [conditional_generation]
      preprocessing_profile: [model_native]
      feature_space: [l1000_landmarks]
      harmonization: [none]
      training_regime: [archs4_only]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [false]
      study_policy: [not_conditioned]
      seed: [1234]

  - name: phase_1_preprocessing_screen
    purpose: Screen shared and paper-native preprocessing on pooled data before tissue expansion.
    axes:
      model: [vinas_wgan_gp, lacan_diffusion]
      model_profile: [practical_screen]
      task: [conditional_generation]
      preprocessing_profile:
        - shared_raw
        - shared_log1p_counts
        - shared_log1p_cpm
        - shared_log1p_cpm_zscore
        - model_native
      feature_space: [hvg_2000, reactome_shared, all_shared]
      harmonization:
        - none
        - within_study_zscore
        - within_study_then_global_zscore
        - combat
        - combat_seq
        - mbatch_median_polish
        - mbatch_empirical_bayes
        - mbatch_anova
        - mober
      training_regime: [osdr_only, archs4_pretrain_osdr_finetune]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [true]
      study_policy: [not_conditioned]
      seed: [2020]

  - name: phase_1_accession_scope
    purpose: Compare one-study, selected multi-study, and all-accession OSDR training.
    axes:
      model: [vinas_wgan_gp, lacan_diffusion]
      model_profile: [practical_screen]
      task: [conditional_generation]
      preprocessing_profile: [best_shared, model_native]
      feature_space: [selected_from_phase_1]
      harmonization: [none]
      training_regime: [osdr_only]
      accession_scope: [single, selected, all_eligible]
      tissue_mode: [per_tissue]
      condition_on_flight: [true]
      study_policy: [not_conditioned]
      seed: [2020]

  - name: phase_2_study_conditioning
    purpose: Test whether explicit accession conditioning improves fidelity without memorizing study identity.
    axes:
      model: [vinas_wgan_gp, lacan_diffusion]
      model_profile: [practical_screen]
      task: [conditional_generation]
      preprocessing_profile: [selected_from_phase_1, model_native]
      feature_space: [selected_from_phase_1]
      harmonization: [selected_from_phase_1]
      training_regime: [osdr_only, archs4_pretrain_osdr_finetune]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [true]
      study_policy: [not_conditioned, conditioned]
      seed: [2020, 2021, 2022]

  - name: phase_3_tissue_expansion
    purpose: Run finalists across every eligible tissue tier and the pooled model.
    axes:
      model: [vinas_wgan_gp, lacan_diffusion]
      model_profile: [practical_screen]
      task: [conditional_generation]
      preprocessing_profile: [best_shared, model_native]
      feature_space: [best_validated]
      harmonization: [best_validated]
      training_regime: [osdr_only, archs4_pretrain_osdr_finetune]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned, per_tissue]
      condition_on_flight: [true]
      study_policy: [best_from_phase_2]
      seed: [2020, 2021, 2022, 2023, 2024]

  - name: phase_4_unconditional_negative_control
    purpose: Quantify whether FLT/GC conditioning adds information beyond tissue and study structure.
    axes:
      model: [vinas_wgan_gp, lacan_diffusion]
      model_profile: [practical_screen]
      task: [conditional_generation]
      preprocessing_profile: [best_shared]
      feature_space: [best_validated]
      harmonization: [best_validated]
      training_regime: [osdr_only, archs4_pretrain_osdr_finetune]
      accession_scope: [all_eligible]
      tissue_mode: [pooled_conditioned]
      condition_on_flight: [false]
      study_policy: [best_from_phase_2]
      seed: [2020, 2021, 2022]

name: nasa-mouse
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - r-base=4.5
  - bioconductor-deseq2=1.50
  - bioconductor-sva=3.58
  - pip
  - pip:
      - -r requirements-nasa-mouse-glare.txt
      - -r requirements-nasa-mouse-generative.txt
      - Markdown>=3.5
      - openpyxl>=3.1
      - Pillow>=10
      - pytest>=8
      - python-pptx>=1.0
